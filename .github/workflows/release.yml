name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      - name: Set npm provenance
        run: npm config set provenance true

      - name: Create release PR or publish
        id: changesets
        # v2 is the release line for Changesets CLI v3: v1 doesn't recognise
        # v3's publish output, so it published to npm but never pushed the
        # git tag or created the GitHub release.
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: pnpm changeset publish
          version-script: pnpm version-packages
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
