name: Changeset Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changeset-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changeset
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Skip check for dependabot PRs: the dependabot-changeset workflow adds
          # the changeset for them. Its push uses GITHUB_TOKEN, which does not
          # re-trigger this workflow, so checking here would fail permanently.
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR — changeset added by dependabot-changeset workflow."
            exit 0
          fi

          # Get list of changed files in this PR
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)

          # Skip check if only .github files were changed
          NON_GITHUB_FILES=$(echo "$CHANGED_FILES" | grep -v '^\.github/' || true)
          if [ -z "$NON_GITHUB_FILES" ]; then
            echo "Only .github files changed — skipping changeset check."
            exit 0
          fi

          # Skip check for dev-only dependency changes: only the lockfile and/or
          # devDependencies in package.json changed. Neither reaches users (the
          # lockfile isn't published), so there's nothing to release.
          OTHER_FILES=$(echo "$NON_GITHUB_FILES" | grep -vxE 'pnpm-lock\.yaml|package\.json' || true)
          if [ -z "$OTHER_FILES" ]; then
            DEV_ONLY=true
            if echo "$NON_GITHUB_FILES" | grep -qx 'package.json'; then
              BASE=$(git merge-base origin/main HEAD)
              DEV_ONLY=$(BASE_PKG="$(git show "$BASE:package.json")" node -e '
                const strip = (s) => { const p = JSON.parse(s); delete p.devDependencies; return JSON.stringify(p); };
                const head = require("fs").readFileSync("package.json", "utf8");
                process.stdout.write(String(strip(process.env.BASE_PKG) === strip(head)));
              ')
            fi
            if [ "$DEV_ONLY" = "true" ]; then
              echo "Only the lockfile and/or devDependencies changed — skipping changeset check."
              exit 0
            fi
          fi

          # Check if any changeset files were added
          CHANGESETS=$(echo "$CHANGED_FILES" | grep '^\.changeset/.*\.md$' | grep -v 'README.md' || true)

          if [ -z "$CHANGESETS" ]; then
            echo "::error::No changeset found. Please run 'pnpm changeset' to create one before merging."
            echo ""
            echo "A changeset is required for every PR. It describes the changes and determines the version bump."
            echo ""
            echo "To add a changeset:"
            echo "  1. Run 'pnpm changeset'"
            echo "  2. Select the type of change (patch/minor/major)"
            echo "  3. Write a summary of the changes"
            echo "  4. Commit the generated file"
            exit 1
          fi

          echo "Changeset found:"
          echo "$CHANGESETS"
